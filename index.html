<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* ---------- animated gradient background ---------- */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientShift 14s ease infinite;
            color: #e2e2e2;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ---------- glassmorphism card ---------- */
        .container {
            max-width: 620px;
            width: 92%;
            margin: 40px auto;
            padding: 36px 32px 32px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
            animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- headings ---------- */
        h1 {
            text-align: center;
            font-weight: 800;
            font-size: 1.85rem;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f9a825, #ff6f00, #ff4081);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        h3 {
            text-align: center;
            margin-top: -2px;
            margin-bottom: 32px;
            font-weight: 500;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.55;
        }

        /* ---------- form ---------- */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        textarea {
            height: 160px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #f0f0f0;
            resize: vertical;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        textarea:focus {
            outline: none;
            border-color: rgba(255, 160, 50, 0.6);
            box-shadow: 0 0 0 3px rgba(255, 160, 50, 0.12), 0 0 20px rgba(255, 160, 50, 0.06);
            background: rgba(255, 255, 255, 0.08);
        }

        /* ---------- button ---------- */
        button {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f59e0b, #f97316, #ef4444);
            background-size: 200% 200%;
            color: #fff;
            border: none;
            padding: 13px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.3s ease, background-position 0.5s ease;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.18),
                transparent
            );
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }

        button:hover {
            background-position: 100% 0;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(249, 115, 22, 0.45);
        }

        button:hover::after {
            left: 130%;
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(249, 115, 22, 0.3);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---------- summary output ---------- */
        #summary-output {
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        #summary-output:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        #summary-heading {
            margin-top: 0;
            margin-bottom: 0;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f9a825, #ff6f00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #summary-text {
            font-size: 0.95rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.75);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>using HuggingFace Transformer</h3>
        <p>Write or Paste your content below for quick summarization.</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div id="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.innerText = "Processing...";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
